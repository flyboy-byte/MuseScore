name: 'Check: Audio import (shape notes)'

# Builds MuseScore, installs the bundled audio2shapenote engine the way a user
# would, converts synthetic recordings with the real app (headless), checks the
# result is a shape-note score, and runs the module's unit tests.

on:
  push:
    branches: [ 'feature/audio-shape-note*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }} ${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio_import:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure workflow
      run: |
        bash ./buildscripts/ci/tools/make_build_number.sh
        echo "BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)" | tee -a $GITHUB_ENV

    - name: Restore ccache files
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-audioimport-ccache-${{ github.sha }}
        restore-keys: |
          ${{runner.os}}-${{runner.arch}}-audioimport-ccache-
          ${{runner.os}}-${{runner.arch}}-utests-ccache-

    - name: Setup ccache
      run: |
        sudo apt-get install -y ccache
        bash ./muse/buildscripts/ci/tools/setup_ccache_config.sh

    - name: Free up disk space
      run: |
        sudo docker system prune -a -f
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.11.2
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
        cache: true

    - name: Setup environment
      run: bash ./buildscripts/ci/linux/setup.sh

    - name: Build app and unit tests
      run: bash ./buildscripts/ci/linux/build_utest.sh -n ${{ env.BUILD_NUMBER }} --enable_code_coverage false

    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-audioimport-ccache-${{ github.sha }}

    - name: Run audio import unit tests
      run: |
        source $HOME/build_tools/environment.sh
        cd build.debug
        export QT_QPA_PLATFORM=minimal:enable_fonts ASAN_OPTIONS=detect_leaks=0:new_delete_type_mismatch=0
        ctest -V -R audioimport --no-tests=error
        echo "::notice title=unit tests::audioimport unit tests passed"

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install the bundled engine like a user would
      run: |
        ENGINE=$(find build.install -name audio2shapenote.py | head -1)
        test -n "$ENGINE" || { echo "engine was not installed with the app"; exit 1; }
        ENGINE_DIR=$(cd "$(dirname "$ENGINE")" && pwd)
        echo "ENGINE_DIR=$ENGINE_DIR" | tee -a $GITHUB_ENV
        python3 "$ENGINE_DIR/setup_engine.py"
        test -x "$ENGINE_DIR/.venv/bin/python"
        echo "::notice title=engine::bundled engine installed at $ENGINE_DIR"

    - name: Engine regression tests
      run: |
        cd tools/audio2shapenote
        $ENGINE_DIR/.venv/bin/python test_shapes.py
        set -o pipefail
        $ENGINE_DIR/.venv/bin/python test_engine.py | tee engine.log
        echo "::notice title=engine tests::$(grep -E '^(melody|chorale):' engine.log | tr '\n' ' ')"

    - name: Convert recordings with MuseScore (headless)
      run: |
        source $HOME/build_tools/environment.sh
        MSCORE=$(realpath "$(find build.install/bin -maxdepth 1 -type f -name 'mscore*' | head -1)")
        echo "app: $MSCORE"
        test -x "$MSCORE"
        mkdir -p audio_import_out && cd audio_import_out
        PY=$ENGINE_DIR/.venv/bin/python
        $PY ../tools/audio2shapenote/make_test_clip.py melody melody.wav
        $PY ../tools/audio2shapenote/make_test_clip.py chorale chorale.wav
        export QT_QPA_PLATFORM=offscreen
        for f in melody chorale; do
          "$MSCORE" -o $f.mscx $f.wav
          "$MSCORE" -o $f.pdf  $f.wav
          "$MSCORE" -o $f.png  $f.wav
        done
        ls -la
        echo "::notice title=convert::$(ls | tr '\n' ' ')"

    - name: Verify shape-note scores
      run: |
        cd audio_import_out
        python3 - <<'EOF'
        import re, sys
        expect = {"melody": (1, 12), "chorale": (4, 32)}
        ok = True
        for name, (staves, notes) in expect.items():
            x = open(f"{name}.mscx", encoding="utf-8").read()
            n_staff = len(re.findall(r"<Part[ >]", x))
            n_notes = len(re.findall(r"<Note[ >]", x))
            schemes = re.findall(r"<noteheadScheme>([^<]+)</noteheadScheme>", x)
            msg = f"{name}: parts={n_staff} notes={n_notes} schemes={sorted(set(schemes))}"
            print(msg)
            print(f"::notice title=verify {name}::{msg}")
            ok &= n_staff == staves and n_notes == notes and set(schemes) == {"shape-7-aikin"} and len(schemes) >= staves
        sys.exit(0 if ok else 1)
        EOF

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: audio_import_results
        path: |
          audio_import_out/
          build.debug/**/test-results*.xml

  # Downloadable Linux app (AppImage) with audio import built in.
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure workflow
      run: |
        bash ./buildscripts/ci/tools/make_build_mode_env.sh -e ${{ github.event_name }} -m devel
        bash ./buildscripts/ci/tools/make_build_number.sh
        echo "BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)" | tee -a $GITHUB_ENV
        echo "BUILD_MODE=$(cat ./build.artifacts/env/build_mode.env)" | tee -a $GITHUB_ENV

    - name: Restore ccache files
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-audioimport-appimage-ccache-${{ github.sha }}
        restore-keys: |
          ${{runner.os}}-${{runner.arch}}-audioimport-appimage-ccache-
          ${{runner.os}}-${{runner.arch}}-ccache-

    - name: Setup ccache
      run: |
        sudo apt-get install -y ccache
        bash ./muse/buildscripts/ci/tools/setup_ccache_config.sh

    - name: Free up disk space
      run: |
        sudo docker system prune -a -f
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.11.2
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
        cache: true

    - name: Setup environment
      run: bash ./buildscripts/ci/linux/setup.sh --arch x86_64 --build-pipewire

    - name: Build
      run: bash ./buildscripts/ci/linux/build.sh -n "${BUILD_NUMBER}" --arch x86_64 --build-pipewire

    - name: Save ccache files
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{runner.os}}-${{runner.arch}}-audioimport-appimage-ccache-${{ github.sha }}

    - name: Package AppImage
      run: bash ./buildscripts/ci/linux/package.sh --arch x86_64 --build-pipewire

    - name: Add engine setup files and instructions
      run: |
        APPIMAGE=$(find build.artifacts -name '*.AppImage' | head -1)
        test -n "$APPIMAGE" || { echo "no AppImage produced"; exit 1; }
        mkdir -p dist/audio2shapenote
        cp "$APPIMAGE" dist/
        cp tools/audio2shapenote/{audio2shapenote.py,setup_engine.py,requirements.txt,README.md,make_test_clip.py} dist/audio2shapenote/
        cat > dist/HOW_TO_RUN.txt <<'TXT'
        MuseScore with audio-to-shape-note import (Linux, x86_64)

        1. One-time engine setup (needs Python 3.10+):
             python3 audio2shapenote/setup_engine.py --user
        2. Make the app runnable and start it:
             chmod +x MuseScore*.AppImage
             ./MuseScore*.AppImage
        3. File > Open a recording (.wav .mp3 .flac .ogg .m4a .aif).
           It opens as shape-note sheet music (7-shape Aikin by default).
           Options: Preferences > Advanced, search "audioImport".

        Command line:  ./MuseScore*.AppImage -o song.mscz song.wav
        Test clip:     python3 audio2shapenote/make_test_clip.py chorale chorale.wav
        TXT
        sed -i 's/^        //' dist/HOW_TO_RUN.txt
        echo "::notice title=appimage::$(basename "$APPIMAGE") ($(du -h "$APPIMAGE" | cut -f1))"

    - name: Upload AppImage
      uses: actions/upload-artifact@v7
      with:
        name: MuseScore_audio_import_Linux_x86_64
        path: dist/
